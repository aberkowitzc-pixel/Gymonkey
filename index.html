<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="Gymonkey: registra tus rutinas, series y progreso en el gimnasio.">
  <title>Gymonkey</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gymonkey">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <img src="icon.svg" alt="" class="logo">
    <h1>Gymonkey</h1>
    <div id="account"></div>
    <button class="ghost gear" data-action="settings" data-i18n-aria="Ajustes" aria-label="Ajustes">⚙️</button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" data-i18n-aria="Secciones" aria-label="Secciones">
    <button data-tab="train" class="active"><span>🏋️</span><span class="lbl" data-i18n="Entrenar">Entrenar</span></button>
    <button data-tab="plan"><span>🧠</span><span class="lbl" data-i18n="Plan">Plan</span></button>
    <button data-tab="routines"><span>📋</span><span class="lbl" data-i18n="Rutinas">Rutinas</span></button>
    <button data-tab="history"><span>🗓️</span><span class="lbl" data-i18n="Historial">Historial</span></button>
    <button data-tab="progress"><span>📈</span><span class="lbl" data-i18n="Progreso">Progreso</span></button>
  </nav>

  <dialog id="dialog"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
