<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="Gymonkey: registra tus rutinas, series y progreso en el gimnasio.">
  <title>Gymonkey</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gymonkey">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <img src="icon.svg" alt="" class="logo">
    <h1>Gymonkey</h1>
    <div id="account"></div>
    <button class="ghost gear" data-action="settings" data-i18n-aria="Ajustes" aria-label="Ajustes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" data-i18n-aria="Secciones" aria-label="Secciones">
    <button data-tab="train" class="active"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span class="lbl" data-i18n="Entrenar">Entrenar</span></button>
    <button data-tab="plan"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></svg><span class="lbl" data-i18n="Plan">Plan</span></button>
    <button data-tab="routines"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg><span class="lbl" data-i18n="Rutinas">Rutinas</span></button>
    <button data-tab="history"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span class="lbl" data-i18n="Historial">Historial</span></button>
    <button data-tab="progress"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg><span class="lbl" data-i18n="Progreso">Progreso</span></button>
  </nav>

  <dialog id="dialog"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
